# ─────────────────────────────────────────────────────────────────────────────
# DevGrasp — Docker Compose (Full Stack)
#
# Usage:
#   docker compose up --build          # Start everything (first time)
#   docker compose up -d               # Start in background
#   docker compose down                # Stop all containers
#   docker compose logs -f server      # Stream server logs
#   docker compose logs -f client      # Stream client logs
#
# Prerequisites:
#   Copy server/.env.example → server/.env and fill in your values.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Express API Server ────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: devgrasp-server
    restart: unless-stopped
    env_file:
      - ./server/.env          # Loads all secrets from your .env file
    ports:
      - "5001:5001"            # Expose API on host port 5001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React Frontend (Nginx) ────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
      args:
        # Inject the API URL at build time into the Vite bundle
        VITE_API_URL: http://localhost:5001
        VITE_API_SECRET: ${VITE_API_SECRET:-}
    container_name: devgrasp-client
    restart: unless-stopped
    ports:
      - "3000:80"              # Expose frontend on host port 3000
    depends_on:
      server:
        condition: service_healthy  # Wait for server health check to pass
