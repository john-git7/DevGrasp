# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — runs on every push and pull request to main/develop
#
# Jobs:
#   lint-client  : ESLint check on React source
#   build-client : Vite production build (verifies no build errors)
#   lint-server  : ESLint check on Node.js source (if ESLint is set up)
#   test-server  : npm test on the Express server (when tests are added)
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Client: Lint ───────────────────────────────────────────────────────────
  lint-client:
    name: Lint Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Client: Build ──────────────────────────────────────────────────────────
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: lint-client          # Only build if lint passes
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        # Pass dummy env vars so Vite doesn't fail on missing VITE_* variables
        run: npm run build
        env:
          VITE_API_URL: https://example-placeholder.onrender.com
          VITE_API_SECRET: ci-placeholder-secret

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # ── Server: Dependency Audit ───────────────────────────────────────────────
  audit-server:
    name: Security Audit (Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        # --audit-level=high: only fail on high/critical severity vulnerabilities
        run: npm audit --audit-level=high

  # ── Server: Test ───────────────────────────────────────────────────────────
  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    needs: audit-server
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # Currently exits 0 with a message. Replace with real test runner (Jest)
        # when tests are added.
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5001
          # Use dummy values so the server doesn't crash on missing secrets
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: ci-test-jwt-secret
          GEMINI_KEY: ci-placeholder-key
          GITHUB_TOKEN: ci-placeholder-token
          API_SECRET: ci-placeholder-api-secret
